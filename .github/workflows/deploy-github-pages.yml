name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static export
        run: rm -rf src/app/api

      - name: Build for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: /Achint_Ai
          NEXT_PUBLIC_SITE_URL: https://achintarora-ai.github.io/Achint_Ai
          NEXT_PUBLIC_GITHUB_URL: https://github.com/achintarora-ai/Achint_Ai
          NEXT_PUBLIC_LINKEDIN_URL: https://www.linkedin.com/in/achint-pal-singh-1a0114288/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
