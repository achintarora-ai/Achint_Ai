name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://achintarora-ai.github.io/Achint_Ai
          NEXT_PUBLIC_GITHUB_URL: https://github.com/achintarora-ai/Achint_Ai
          NEXT_PUBLIC_LINKEDIN_URL: https://www.linkedin.com/in/achint-pal-singh-1a0114288/
